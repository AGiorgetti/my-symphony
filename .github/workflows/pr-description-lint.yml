name: pr-description-lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  validate-pr-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR description format
        env:
          PR_BODY_JSON: ${{ toJson(github.event.pull_request.body) }}
        run: |
          echo "$PR_BODY_JSON" | jq -r '.' > /tmp/pr_body.md

          missing=0
          for heading in '#### Context' '#### TL;DR' '#### Summary' '#### Test Plan'; do
            if ! grep -qF "$heading" /tmp/pr_body.md; then
              echo "Missing required heading: $heading" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "PR body must include all required headings. Refer to .github/pull_request_template.md" >&2
            exit 1
          fi
